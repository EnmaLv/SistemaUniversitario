services:
  app:
    build: .
    container_name: SisgestiondeBienestraEstudiantil
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "5731:5731"
      - "8080:8080"
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - laravelConnect

  mysql:
    image: mysql:8.0
    container_name: mysqlbienestraestudiantil
    restart: always
    command: --log-bin-trust-function-creators=1
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - datos_db:/var/lib/mysql
    networks:
      - laravelConnect

volumes:
  datos_db:

networks:
  laravelConnect:
    driver: bridge